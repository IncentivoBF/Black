<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campanha de Incentivo Black Friday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,800;1,600;1,800;1,900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: capa no estilo da arte da campanha (roxo + faixas douradas: trader | 1º | 2º) -> ranking do trader (pódio + busca + lista). Visual único roxo. */
:root{
  --bg:#2a0a6e; --bg2:#4a12b8; --deep:#1a0548; --pill:rgba(26,5,72,.72); --line:rgba(255,255,255,.14);
  --fg:#ffffff; --muted:#cbb8f5; --gold:#e2b55e; --gold2:#a8742a; --ok:#4ef0a0;
  --font:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:dark;
}
html{background:#06030c}
body{min-height:100vh;color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;overflow-x:hidden;background:#06030c}
.wrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;background:linear-gradient(160deg,#050208 0%,#0d0418 30%,#1c0a45 70%,#2e0f78 100%);max-width:440px;margin:0 auto;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gold{background:linear-gradient(180deg,#f6e3b0,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* CAPA */
.hero{position:relative;text-align:center;padding-block:14px 6px}
.hero::before{content:"";position:absolute;left:-16px;right:-16px;top:-30px;height:330px;background:radial-gradient(60% 55% at 50% 30%,rgba(168,62,255,.55),rgba(108,30,220,.25) 55%,transparent 75%),radial-gradient(40% 30% at 80% 10%,rgba(226,181,94,.18),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.hero h1{text-shadow:0 0 28px rgba(190,110,255,.65)}
.hero .slogan{color:var(--gold)}
.kicker{display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:400;line-height:1.15;letter-spacing:.02em}
.kicker::before,.kicker::after{content:"";width:34px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.kicker::after{background:linear-gradient(90deg,var(--gold),transparent)}
.beam{position:relative;height:14px;width:85%;margin:-2px auto 0;background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.95) 0,rgba(214,160,255,.8) 12%,rgba(150,70,255,.35) 45%,transparent 72%);filter:blur(.3px)}
.beam::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.hero h1{font-family:'Open Sans','Segoe UI',system-ui,sans-serif;font-weight:700;font-size:clamp(40px,11.5vw,50px);line-height:1.05;margin:4px 0 0;letter-spacing:-.03em}
.hero h1 .w,.hero h1 .gold{color:#fff;background:none;-webkit-background-clip:initial;background-clip:initial}
.hero .slogan{font-weight:400;font-style:italic;font-size:14px;margin-top:8px}
.badge{display:inline-block;margin-top:12px;padding:6px 26px;border:2px solid var(--gold);border-radius:40px;font-weight:800;font-style:italic;font-size:16px;box-shadow:0 0 18px rgba(226,181,94,.45),inset 0 0 12px rgba(226,181,94,.2);background:rgba(26,5,72,.5)}
.badge b{color:var(--gold);font-weight:900}
.hero p{font-style:normal;font-weight:400;font-size:13px;margin:8px auto 0;max-width:34em}
.list-title{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:18px 0 10px;font-weight:600}
.pills{display:flex;flex-direction:column;gap:9px}
.pill{display:block;border:2px solid var(--gold);border-radius:22px;padding:7px 16px 8px;background:var(--pill);color:var(--fg);text-decoration:none;
  box-shadow:0 0 12px rgba(226,181,94,.4),inset 0 0 12px rgba(226,181,94,.1);transition:transform .15s,box-shadow .15s}
.pill:hover,.pill:focus-visible{transform:scale(1.015);box-shadow:0 0 22px rgba(226,181,94,.7);outline:none}
.pill .tr{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-style:italic;font-size:14px;color:var(--gold);line-height:1.2}
.pill .tr small{font-style:normal;font-weight:600;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.pill .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:3px;align-items:center}
.pill .top > span{min-width:0;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.pill .top > span + span{border-left:1px solid rgba(226,181,94,.55);padding-left:10px}
.pill .w1{font-weight:800;font-size:13px!important}
.pill .k{color:var(--gold);font-weight:800;font-style:italic;margin-right:3px}
.pill .pc{color:var(--gold);font-weight:700}
.tap{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.deco{display:block;width:100%;max-width:100%;margin-top:8px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 80%,transparent);mask-image:linear-gradient(180deg,transparent,#000 18%,#000 80%,transparent)}
.ex{color:var(--muted);font-size:12px;text-align:center;margin-top:6px}

/* RANKING */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:800;text-decoration:none;font-size:15px;padding:8px 0}
.back:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.rhead{text-align:center;margin-top:6px}
.rhead .k{font-size:15px}
.rhead .bfx{font-family:'Open Sans','Segoe UI',system-ui,sans-serif;font-weight:600;letter-spacing:-.03em;font-size:38px;line-height:1.05}.rhead .bfx .gold{color:#fff;background:none;-webkit-background-clip:initial;background-clip:initial}
.rhead h2{display:inline-block;margin:14px 0 6px;padding:6px 26px;border:2px solid var(--gold);border-radius:40px;font-weight:800;font-style:italic;font-size:clamp(18px,5vw,28px);box-shadow:0 0 18px rgba(226,181,94,.45);background:var(--pill)}
.sub{color:var(--muted);font-size:15px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:10px;margin:26px 0 22px}
.p{border-radius:20px;padding:14px 8px;text-align:center;color:#1a0548;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.p .pos{font-weight:900;font-style:italic;font-size:clamp(28px,7vw,44px);line-height:1}
.p .n{font-weight:800;font-size:clamp(12px,3.4vw,18px);margin-top:6px;overflow-wrap:anywhere;line-height:1.2}
.p .r{font-size:11px;opacity:.75;margin-top:2px}
.p .v{font-weight:900;font-size:clamp(22px,5.5vw,32px);margin-top:8px}
.p .v small{display:block;font-size:10px;font-weight:600;opacity:.75}
.podium.two{grid-template-columns:1.1fr 1fr}
.podium.two .g{min-height:220px}.podium.two .s{min-height:190px}
.g{background:linear-gradient(160deg,#f6e3b0,var(--gold) 50%,var(--gold2));min-height:235px;box-shadow:0 0 28px rgba(226,181,94,.55)}
.s{background:linear-gradient(160deg,#ffffff,#c9c3dc);min-height:205px}
.b{background:linear-gradient(160deg,#f3b583,#c46a2d);min-height:185px}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;margin-bottom:6px;background:linear-gradient(180deg,#140630 75%,rgba(20,6,48,0))}
.search label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.search input{width:100%;box-sizing:border-box;background:var(--pill);border:2px solid rgba(226,181,94,.55);color:var(--fg);font:inherit;font-size:16px;padding:11px 18px;border-radius:999px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 14px rgba(226,181,94,.45)}
.count{color:var(--muted);font-size:13px;margin-top:6px}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:8px 20px 8px 12px}
.row.hit{border:2px solid var(--gold);box-shadow:0 0 14px rgba(226,181,94,.5)}
.row .ps{font-weight:900;font-style:italic;color:var(--gold);font-size:18px;text-align:center}
.row .nm{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row .rg{display:block;color:var(--muted);font-size:12px}
.row .res{text-align:right;font-variant-numeric:tabular-nums}
.row .pc{display:block;font-weight:800;font-size:18px}
.bar{display:block;margin-top:4px;width:clamp(70px,22vw,160px);height:7px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin-left:auto}
.bar i{display:block;height:100%;border-radius:6px}
.empty{color:var(--muted);text-align:center;padding:20px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:24px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}

/* SEÇÕES */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:800;font-style:italic;font-size:17px;margin-bottom:10px}
.sec-h::before,.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(226,181,94,.6),transparent)}
.prize{text-align:center;color:var(--muted);font-size:12px;margin:-4px 0 10px}
.prize b{color:var(--gold)}
.champ{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:10px;border:2px solid var(--gold);border-radius:22px;padding:8px 14px 8px 6px;background:radial-gradient(120% 120% at 0% 50%,rgba(226,181,94,.25),var(--pill) 60%);box-shadow:0 0 22px rgba(226,181,94,.5)}
.champ img{width:112px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.champ .lbl{font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:600}
.champ .nm{font-weight:900;font-style:italic;font-size:21px;line-height:1.1;margin-top:2px}
.champ .pc{font-weight:800;color:var(--gold);font-size:18px;margin-top:4px}
.champ .tx{font-size:11.5px;color:var(--muted);margin-top:2px}
.tlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 10px;font-size:14px}
.trow .ps{font-weight:900;font-style:italic;color:var(--gold);text-align:center}
.trow .nm{font-weight:600}
.trow .pc{font-weight:800;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:1fr;gap:9px}
.cat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;border:2px solid var(--gold);border-radius:22px;padding:10px 16px 10px 10px;background:var(--pill);color:var(--fg);text-decoration:none;box-shadow:0 0 12px rgba(226,181,94,.4);transition:transform .15s,box-shadow .15s}
.cat:hover,.cat:focus-visible{transform:scale(1.015);box-shadow:0 0 22px rgba(226,181,94,.7);outline:none}
.cat .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#f6e3b0,var(--gold) 50%,var(--gold2));color:#1a0548;font-weight:900;font-size:14px}
.cat .t{font-weight:800;font-style:italic;font-size:16px;line-height:1.15}
.cat .d{display:block;font-size:12px;color:var(--muted);font-style:normal;font-weight:400;margin-top:2px}
.cat .go{color:var(--gold);font-weight:800;font-size:20px}
.win{display:inline-block;background:var(--gold);color:#1a0548;font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;font-style:normal}
.row.prem{border:2px solid var(--gold);background:rgba(226,181,94,.12)}
.pill .wn{display:block;font-size:12.5px;margin-top:3px;line-height:1.3}
.crumb{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}

.vagas{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.vagas b{color:var(--gold);font-size:15px}
.br{display:flex;flex-direction:column;gap:9px}
.bcard{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:10px;border:2px solid var(--gold);border-radius:22px;padding:8px 14px 8px 8px;background:radial-gradient(120% 120% at 0% 50%,rgba(226,181,94,.22),var(--pill) 60%);box-shadow:0 0 16px rgba(226,181,94,.45);color:var(--fg);text-decoration:none}
.bcard:focus-visible,.bcard:hover{box-shadow:0 0 26px rgba(226,181,94,.75);outline:none}
.bcard.big{grid-template-columns:104px minmax(0,1fr) auto}
.bcard img{width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.medal{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#f6e3b0,var(--gold) 50%,var(--gold2));color:#1a0548;font-weight:900;font-style:italic;font-size:24px;box-shadow:0 0 14px rgba(226,181,94,.5)}
.bcard .fn{font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:600}
.bcard .nm{font-weight:900;font-style:italic;font-size:18px;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.bcard .tx{font-size:12px;color:var(--muted);margin-top:2px}
.bcard .tx b{color:var(--gold)}
.bcard .go{color:var(--gold);font-weight:800;font-size:20px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:var(--pill);border:1px solid rgba(226,181,94,.45);border-radius:999px;padding:7px 8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#1a0548;border-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pill .dv{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;margin-right:4px}

.podium.one{display:flex;justify-content:center;margin:22px 0 20px}
.podium.one .p{width:62%;min-height:0;padding:18px 10px}
.vt{display:inline-flex;align-items:center;margin-left:6px;color:var(--gold);vertical-align:middle;line-height:1}
.vt svg{width:18px;height:12px;display:block}
.p .vt{color:#1a0548;--vtcut:#e9d7a8;margin:0}
.vnote{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 14px;border:1px solid rgba(226,181,94,.45);border-radius:16px;background:rgba(226,181,94,.07);font-size:13px;line-height:1.35}
.vnote .vt{margin-left:0}.vnote .vt svg{width:22px;height:15px}
.vnote b{color:var(--gold)}

.how2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.step{border:1px solid rgba(226,181,94,.45);border-radius:14px;padding:7px 10px;background:var(--pill);text-align:center}
.step ul{list-style:none;margin:3px 0 0;padding:0;font-size:10.5px;color:var(--muted);line-height:1.4}
.step ul li::before{content:"✓ ";color:var(--gold);font-weight:800}
.step .n{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.12em;color:#1a0548;background:var(--gold);border-radius:20px;padding:2px 8px}
.step .h{font-weight:800;font-style:italic;font-size:13px;line-height:1.15;margin-top:3px}
.step .h b{color:var(--gold)}
.step .d{font-size:10.5px;color:var(--muted);margin-top:1px;line-height:1.3}
.rg .vd{color:var(--ok)}.rg .at{font-weight:800;color:var(--ok)}
.rg.low .vd,.rg.low .at{color:#ffb36b}
.pill .vm{font-size:11px;color:var(--ok);font-weight:600}
.res .lb{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--gold);opacity:.85;margin-top:3px;text-transform:uppercase}
.p .vs{font-size:11px;font-weight:700;color:#0b6b3a;margin-top:4px}
.p .vs b{font-weight:900}
.bcard .tx .gv{color:var(--ok);font-weight:800}
.divider{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;text-align:center;margin:16px 0 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.row.ne{opacity:1}
.row .ps.ne{color:var(--muted)}
.pos-tag{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:2px}
.podium.many{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;gap:10px}
.podium.many{gap:8px}
.podium.many .p{min-height:0;padding:10px 6px;border-radius:14px}
.podium.many .pos{font-size:24px}
.podium.many .n{font-size:13px;margin-top:2px}
.podium.many .vs{font-size:10px;margin-top:2px}
.podium.many .v{font-size:20px;margin-top:4px}
.podium.many .v small{font-size:9px}
.podium.many .win{font-size:8px;padding:2px 6px;margin-top:4px!important}
.steps{position:relative;display:flex;flex-direction:column;gap:12px;margin:18px auto 0;max-width:380px;text-align:left}
.steps::before{content:"";position:absolute;left:15px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(226,181,94,.2))}
.st{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.st .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#f6e3b0,var(--gold) 50%,var(--gold2));color:#1a0548;font-weight:900;font-style:italic;font-size:16px;box-shadow:0 0 12px rgba(226,181,94,.5)}
.st .h{font-weight:800;font-style:italic;font-size:15px;line-height:1.2;padding-top:5px}
.st .h b{color:var(--gold)}
.st .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.st .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.st .chips span{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(226,181,94,.35)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{position:relative;overflow:hidden;border-radius:16px;padding:8px 8px 8px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(26,5,72,.75));border:1px solid rgba(226,181,94,.5);box-shadow:0 0 18px rgba(150,70,255,.25)}
.tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.tile.t2::after{animation-delay:2.2s}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.tile .ico{display:grid;place-items:center;width:30px;height:30px;margin:0 auto;border-radius:50%;background:linear-gradient(160deg,#f6e3b0,var(--gold) 50%,var(--gold2));color:#1a0548;box-shadow:0 0 16px rgba(226,181,94,.55);animation:bob 3s ease-in-out infinite}
.tile.t2 .ico{animation-delay:1.5s}
.tile .ico svg{width:17px;height:17px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tile .tg{display:block;font-size:8px;font-weight:800;letter-spacing:.14em;color:var(--gold);margin-top:4px}
.tile .big{font-weight:900;font-style:italic;font-size:20px;line-height:1;margin-top:2px}
.tile .sm{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2}
.tile .crit{display:flex;justify-content:center;gap:5px;margin-top:5px}
.tile .crit span{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gold)}
.tile .crit svg{width:14px;height:14px}
.tile .crit i{font-style:normal;font-size:7.5px;font-weight:700;color:var(--fg);opacity:.85}
.tile .up{display:inline-block;margin-top:5px;font-size:9px;font-weight:800;color:#1a0548;background:linear-gradient(160deg,#f6e3b0,var(--gold));padding:3px 10px;border-radius:20px}
@media (prefers-reduced-motion:reduce){.tile::after,.tile .ico{animation:none}}

/* NOVO DESIGN só no topo da capa (referência lilás) */

    count.textContent = q && rows.length ? `${rows.length} resultado(s)` : '';
  }
  busca.addEventListener('input', draw);
  draw();
}

function route(forced){
  const id = typeof forced === 'string' ? forced : location.hash.slice(1);
  const f = F(id);
  if (id === 'entenda') entendaPage();
  else if (id === 'galera') muralPage();
  else if (f && f.breve) brevePage(f);
  else if (f) { f.escopo === 'brasil' ? lista(f) : porTrader(f); }
  else {
    const f2 = FUNCOES.find(x => x.escopo === 'trader' && id.startsWith(x.id + '-'));
    const ti = f2 ? TRADERS.findIndex(t => f2.id + '-' + slug(t) === id) : -1;
    ti >= 0 ? (f2.breve ? brevePage(f2) : lista(f2, ti)) : cover();
  }
  if (id && id !== 'galera') { const h = document.querySelector('#app .rhead'); const sb = document.querySelector('#app .search input'); if (sb) sb.insertAdjacentHTML('afterend', '<p class="rnote">Para ser premiado é preciso cumprir todos os critérios de elegibilidade.</p>'); if (h) h.insertAdjacentHTML('afterend', `<a class="mbtn mini" href="#galera"><span class="mi">📣</span><span><b>Mural da Galera</b><small>Solte seu grito! 💀 🏆 ✈</small></span><span class="go">›</span></a>`);
    const fc = h && h.querySelector('.fcres'), mb = document.querySelector('#app .mbtn.mini');
    if (fc && mb) { const w = document.createElement('div'); w.className = 'fcwrap'; w.appendChild(fc); mb.insertAdjacentElement('afterend', w); } }
  try { window.scrollTo(0,0); } catch (_) {}
}
// Navegação por clique (não depende do endereço da página)
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  route(id);
  try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (_) {}
});
window.addEventListener('hashchange', () => route());
route();
// Contador de acessos: 1 registro por visita (aba "Acessos" da planilha do Mural)
(function () {
  if (!MURAL_URL) return;
  let vid = '';
  try { if (sessionStorage.getItem('bfVisita')) return; sessionStorage.setItem('bfVisita', '1'); } catch (_) {}
  try { vid = localStorage.getItem('bfId') || ''; if (!vid) { vid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('bfId', vid); } } catch (_) {}
  try { fetch(MURAL_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'visita', v: vid }) }).catch(() => {}); } catch (_) {}
})();
